<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elastic Security: Evolution of Cyber Security</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  h1{font-size:88px;line-height:.96;letter-spacing:-3.6px;margin-top:150px}
  .sub{font-size:30px;font-weight:500;line-height:1.2;letter-spacing:-.8px;color:var(--char);max-width:500px;margin-top:28px}

  /* the 3D shield: two extruded halves, locked together as one solid */
  #stage{position:absolute;z-index:1;left:742px;top:170px;width:380px;height:380px;perspective:1500px}
  #tilt,.pw,.pf{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d}
  .pf svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
  #tilt{animation:tilt 9s ease-in-out infinite alternate}
  @keyframes tilt{from{transform:rotateY(-26deg) rotateX(9deg)}to{transform:rotateY(26deg) rotateX(-3deg)}}

  /* the whole shield moves as one: it drops in, then floats while it tilts */
  #stage{animation:land .9s cubic-bezier(.2,.9,.25,1.1) .3s both, bob 4.5s ease-in-out 1.5s infinite}
  @keyframes land{from{opacity:0;transform:translateY(-60px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  #shadow{position:absolute;left:70px;right:70px;bottom:-34px;height:34px;border-radius:50%;background:rgba(30,40,80,.24);filter:blur(14px);
    animation:shin .8s ease 1.1s both, sh 4.5s ease-in-out 1.5s infinite}
  @keyframes shin{from{opacity:0}to{opacity:1}}
  @keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
</style>
</head>
<body data-foot="Elastic Security · 2026">
<div class="z">
  <div class="eyebrow in1">October 7, 2026</div>
  <h1 class="in2">Elastic<br><span class="b">Security</span></h1>
  <p class="sub in3">Evolution of Cyber Security</p>
</div>

<div id="stage" aria-label="Elastic Security logo">
  <div id="shadow"></div>
  <div id="tilt">
    <div class="pw" id="wa"><div class="pf" id="fa"></div></div>
    <div class="pw" id="wb"><div class="pf" id="fb"></div></div>
  </div>
</div>

<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 640, y: 30, w: 640, h: 660, seed: 4, blobs: 6, thr: .5});

  // Elastic Security logo geometry, as supplied (64x64 artboard), split into its two halves
  const FRONT = {o: '#FA744E', t: '#02BCB7', c: '#343741'};
  const SIDE  = {o: ['#E0613B', '#A8401F'], t: ['#04A39F', '#027A77'], c: ['#2A2C35', '#14151A']};
  const HALF_A = [['o', 'M20 17V4H56V34C56 41.0112 43.7467 45.6044 39 47V17H20Z']];
  const HALF_B = [['t', 'M9 39.3984V22H34V60C34 60 9 49.5847 9 39.3984Z'], ['c', 'M19 22H34V47C28.406 44.9626 19 40.292 19 34.4224V22Z']];

  const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join(''); };

  // extrude by stacking slices: the front slice carries the logo colors, the rest shade toward the back
  const N = 26, STEP = 1.6;
  function extrude(host, paths){
    for (let i = 0; i < N; i++){
      const k = i / (N - 1);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      EW.gen(svg); svg.setAttribute('viewBox', '0 0 64 64');
      svg.style.transform = `translateZ(${(N * STEP / 2 - i * STEP).toFixed(2)}px)`;
      svg.innerHTML = paths.map(([c, d]) => `<path d="${d}" fill="${i === 0 ? FRONT[c] : mix(SIDE[c][0], SIDE[c][1], k)}"/>`).join('');
      host.appendChild(svg);
    }
  }
  extrude(document.getElementById('fa'), HALF_A);
  extrude(document.getElementById('fb'), HALF_B);
})();
</script>
</body>
</html>
