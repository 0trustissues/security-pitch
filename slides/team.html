<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meet your Elastic team</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  h1{font-size:58px;letter-spacing:-2.2px;margin-top:12px}

  .team{position:absolute;left:72px;right:80px;top:226px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;z-index:2}
  .p{position:relative;background:#fff;border:1px solid var(--ink)}
  .p .ph{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--bg);border-bottom:1px solid var(--ink)}
  .p .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .p .tx{padding:16px 18px 18px}
  .p .nm{font:600 22px/1.15 var(--sans);letter-spacing:-.6px;color:var(--ink)}
  .p .tt{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font:500 11px/1.45 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
  .p .tt i{flex:none;width:8px;height:8px;margin-top:3px}
  /* each card carries one accent from the Elastic palette */
  .p.c1{box-shadow:8px 8px 0 var(--blue)}   .p.c1 .tt i{background:var(--blue)}
  .p.c2{box-shadow:8px 8px 0 var(--orange)} .p.c2 .tt i{background:var(--orange)}
  .p.c3{box-shadow:8px 8px 0 var(--teal)}   .p.c3 .tt i{background:var(--teal)}
  .p.c4{box-shadow:8px 8px 0 var(--pink)}   .p.c4 .tt i{background:var(--pink)}
</style>
</head>
<body data-foot="Elastic Security · Team">
<div class="z">
  <div class="eyebrow in1">Elastic · <b>Security</b></div>
  <h1 class="in2">Meet your <span class="b">Elastic team.</span></h1>
</div>

<div class="team">
  <div class="p c1 in3">
    <div class="ph"><img src="assets/kelsey-bodziner.jpg" alt="Kelsey Bodziner"></div>
    <div class="tx"><div class="nm">Kelsey Bodziner</div><div class="tt"><i></i><span>Account Executive</span></div></div>
  </div>
  <div class="p c2 in4">
    <div class="ph"><img src="assets/tim-cashin.png" alt="Tim Cashin"></div>
    <div class="tx"><div class="nm">Tim Cashin</div><div class="tt"><i></i><span>Account Executive (Security)</span></div></div>
  </div>
  <div class="p c3 in5">
    <div class="ph"><img src="assets/alan-visser.png" alt="Alan Visser"></div>
    <div class="tx"><div class="nm">Alan Visser</div><div class="tt"><i></i><span>Solutions Architect</span></div></div>
  </div>
  <div class="p c4 in6">
    <div class="ph"><img src="assets/sunny-brar.jpg" alt="Sunny Brar"></div>
    <div class="tx"><div class="nm">Sunny Brar</div><div class="tt"><i></i><span>Solutions Architect (Security)</span></div></div>
  </div>
</div>

<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
  EW.dots({x: 700, y: 20, w: 560, h: 150, gap: 9, r: .9, seed: 7, blobs: 4, thr: .5});
</script>
</body>
</html>
