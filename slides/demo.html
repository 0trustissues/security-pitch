<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  .live{position:absolute;left:0;width:1280px;top:150px;display:flex;justify-content:center;z-index:3}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;background:#fff;border:1px solid var(--ink);box-shadow:4px 4px 0 var(--pink);font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .pill i{width:10px;height:10px;border-radius:50%;background:var(--pink);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,78,152,.55)}50%{box-shadow:0 0 0 9px rgba(240,78,152,0)}}

  .word{position:absolute;left:0;width:1280px;top:196px;text-align:center;z-index:3;font:600 260px/1 var(--sans);letter-spacing:-14px;color:var(--ink);white-space:nowrap}
  .word .b{color:var(--blue)}
  .word .cur{display:inline-block;width:34px;height:190px;margin-left:14px;background:var(--blue);vertical-align:-6px;animation:blink 1.1s steps(1) infinite 1.4s}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  .term{position:absolute;left:0;width:1280px;top:520px;text-align:center;z-index:3;font:500 20px var(--mono);letter-spacing:.04em;color:var(--char);height:30px}
  .term span{color:var(--blue);margin-right:12px}
  #line{display:inline-block;border-right:2px solid var(--ink);padding-right:3px;min-width:12px;text-align:left}
</style>
</head>
<body class="soft" data-foot="Elastic Security · Demo">
<div class="live in1"><span class="pill"><i></i>Live demo</span></div>
<div class="word in2">Demo<span class="b">.</span></div>
<div class="term in4"><span>$</span><b id="line" style="font-weight:500"></b></div>

<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 0, y: 0, w: 1280, h: 720, seed: 9, blobs: 9, thr: .62, gap: 12, r: 1.0});
  const steps = ['detect', 'investigate', 'respond'], el = document.getElementById('line');
  let i = 0, n = 0, dir = 1, hold = 0;
  (function tick(){
    const w = steps[i];
    if (hold > 0){ hold--; return setTimeout(tick, 60); }
    n += dir; el.textContent = w.slice(0, n);
    if (n === w.length){ dir = -1; hold = 16; }
    if (n === 0 && dir === -1){ dir = 1; i = (i + 1) % steps.length; }
    setTimeout(tick, dir === 1 ? 90 : 45);
  })();
})();
</script>
</body>
</html>
